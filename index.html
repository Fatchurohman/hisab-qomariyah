<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Hisab Qomariyah - Premium Edition</title>
  
  <!-- Font Google & FontAwesome Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Astronomy Engine Library (Pro-grade Astronomy Calculations) -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-gold: #f39c12;
      --accent-cyan: #00f2fe;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(243, 156, 18, 0.12) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    /* Container Utama Glassmorphism */
    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      margin: auto 0;
    }

    /* Header & Badge Developer */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    /* Developer Badge & Blinking Dot */
    .developer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .developer-badge strong {
      color: var(--accent-gold);
    }

    .blinking-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px var(--accent-cyan); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }

    /* Form Input UI */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    /* Button Gradient */
    .btn-calc {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
    }

    .btn-calc:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(0, 114, 255, 0.4);
    }

    /* Display Hasil */
    .result-box {
      margin-top: 24px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: none;
    }

    .status-badge {
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 16px;
    }

    .status-pass {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-fail {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 0.85rem;
    }

    .data-item {
      background: rgba(255, 255, 255, 0.02);
      padding: 10px;
      border-radius: 8px;
    }

    .data-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .data-item strong {
      color: #fff;
      font-size: 0.95rem;
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Hisab Qomariyah Pro</h1>
      <div class="developer-badge">
        <div class="blinking-dot"></div>
        <span>Developer : <strong>fatur62</strong></span>
      </div>
    </div>

    <!-- Input Form -->
    <div class="form-group">
      <label><i class="fa-regular fa-calendar"></i> Tanggal Pengamatan (Masehi)</label>
      <input type="date" id="inputDate">
    </div>

    <div class="input-row">
      <div class="form-group">
        <label><i class="fa-solid fa-location-dot"></i> Lintang (°S/°N)</label>
        <input type="number" step="any" id="inputLat" value="-6.1754" placeholder="-6.17 (Jakarta)">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-map-pin"></i> Bujur (°E)</label>
        <input type="number" step="any" id="inputLon" value="106.8272" placeholder="106.82">
      </div>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-scale-balanced"></i> Kriteria Hilal</label>
      <select id="inputCriterion">
        <option value="MABIMS">MABIMS Baru (Tinggi 3°, Elongasi 6.4°)</option>
        <option value="WUJUDUL_HILAL">Wujudul Hilal (Tinggi > 0°)</option>
      </select>
    </div>

    <button class="btn-calc" onclick="hitungkanHisab()">
      <i class="fa-solid fa-calculator"></i> Hitung Awal Bulan
    </button>

    <!-- Display Hasil Perhitungan -->
    <div class="result-box" id="resultContainer">
      <div id="statusBadge" class="status-badge"></div>
      
      <div class="data-grid">
        <div class="data-item">
          <span>Terbenam Matahari:</span>
          <strong id="resSunset">-</strong>
        </div>
        <div class="data-item">
          <span>Tinggi Hilal (Alt):</span>
          <strong id="resAlt">-</strong>
        </div>
        <div class="data-item">
          <span>Sudut Elongasi:</span>
          <strong id="resElongation">-</strong>
        </div>
        <div class="data-item">
          <span>Status Hilal:</span>
          <strong id="resHilalState">-</strong>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© Proyek #11 — Sistem Hisab Astronomis Otomatis</p>
  </footer>

    <script>
    // Set Tanggal Hari Ini secara otomatis
    document.getElementById('inputDate').valueAsDate = new Date();

    function hitungkanHisab() {
      try {
        // Cek apakah library Astronomy sudah terload
        if (typeof Astronomy === 'undefined') {
          alert("Error: Library Astronomy tidak terload. Pastikan ada internet!");
          return;
        }

        const dateVal = document.getElementById('inputDate').value;
        const lat = parseFloat(document.getElementById('inputLat').value);
        const lon = parseFloat(document.getElementById('inputLon').value);
        const criterion = document.getElementById('inputCriterion').value;

        if (!dateVal || isNaN(lat) || isNaN(lon)) {
          alert("Silakan lengkapi data input!");
          return;
        }

        const dateObj = new Date(dateVal + 'T12:00:00');
        const observer = new Astronomy.Observer(lat, lon, 0);

        // Cari Waktu Sunset
        const sunsetObj = Astronomy.SearchRiseSet('Sun', observer, -1, dateObj, 1);
        if (!sunsetObj) {
          alert("Gagal menghitung waktu terbenam matahari.");
          return;
        }

        const sunsetTime = sunsetObj.date;

        // Hitung Posisi Bulan
        const moonEquator = Astronomy.Equator('Moon', sunsetTime, observer, true, true);
        const moonHorizon = Astronomy.Horizon(sunsetTime, observer, moonEquator.ra, moonEquator.dec, 'Refracted');
        const sunEquator = Astronomy.Equator('Sun', sunsetTime, observer, true, true);
        
        const moonAltitude = moonHorizon.altitude;
        const elongation = Astronomy.AngleBetween(moonEquator, sunEquator);

        // Kriteria
        let is1stQomariyah = false;
        let reasonText = "";

        if (criterion === "MABIMS") {
          is1stQomariyah = (moonAltitude >= 3.0 && elongation >= 6.4);
          reasonText = is1stQomariyah ? "Memenuhi Kriteria MABIMS Baru" : "Belum Memenuhi MABIMS (Tinggi < 3° atau Elongasi < 6.4°)";
        } else {
          is1stQomariyah = (moonAltitude > 0);
          reasonText = is1stQomariyah ? "Memenuhi Kriteria Wujudul Hilal" : "Bulan Masih Di Bawah Ufuk";
        }

        // Tampilkan Hasil
        document.getElementById('resSunset').innerText = sunsetTime.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
        document.getElementById('resAlt').innerText = moonAltitude.toFixed(2) + '°';
        document.getElementById('resElongation').innerText = elongation.toFixed(2) + '°';
        document.getElementById('resHilalState').innerText = moonAltitude > 0 ? "Di Atas Ufuk" : "Di Bawah Ufuk";

        const badge = document.getElementById('statusBadge');
        const container = document.getElementById('resultContainer');
        
        container.style.display = "block"; // INI PERINTAH UNTUK MEMUNCULKAN KOTAKNYA

        if (is1stQomariyah) {
          badge.className = "status-badge status-pass";
          badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> BESOK MASUK TANGGAL 1<br><small>${reasonText}</small>`;
        } else {
          badge.className = "status-badge status-fail";
          badge.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> BELUM MASUK TANGGAL 1<br><small>${reasonText}</small>`;
        }

      } catch (err) {
        alert("Terjadi kesalahan sistem: " + err.message);
      }
    }
  </script>

</body>
</html>
