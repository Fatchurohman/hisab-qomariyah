<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Hisab Qomariyah Pro</title>
  
  <!-- Font Google & FontAwesome Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-gold: #f39c12;
      --accent-cyan: #00f2fe;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(243, 156, 18, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      margin: auto 0;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .developer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .developer-badge strong {
      color: var(--accent-gold);
    }

    .blinking-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-cyan);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px var(--accent-cyan); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-cyan);
    }

    .btn-calc {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 8px 20px rgba(0, 114, 255, 0.3);
    }

    .result-box {
      margin-top: 22px;
      padding: 18px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: none;
    }

    .status-badge {
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      text-align: center;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .status-pass {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .status-fail {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .data-item {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .data-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    .data-item strong {
      color: #fff;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Hisab Qomariyah Pro</h1>
      <div class="developer-badge">
        <div class="blinking-dot"></div>
        <span>Developer : <strong>fatur62</strong></span>
      </div>
    </div>

    <div class="form-group">
      <label><i class="fa-regular fa-calendar"></i> Tanggal Pengamatan (Masehi)</label>
      <input type="date" id="inputDate">
    </div>

    <div class="input-row">
      <div class="form-group">
        <label><i class="fa-solid fa-location-dot"></i> Lintang (°S/°N)</label>
        <input type="number" step="any" id="inputLat" value="-6.1754">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-map-pin"></i> Bujur (°E)</label>
        <input type="number" step="any" id="inputLon" value="106.8272">
      </div>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-scale-balanced"></i> Kriteria Hilal</label>
      <select id="inputCriterion">
        <option value="MABIMS">MABIMS Baru (Tinggi 3°, Elongasi 6.4°)</option>
        <option value="WUJUDUL_HILAL">Wujudul Hilal (Tinggi > 0°)</option>
      </select>
    </div>

    <button class="btn-calc" onclick="hitungkanHisab()">
      <i class="fa-solid fa-calculator"></i> Hitung Awal Bulan
    </button>

    <div class="result-box" id="resultContainer">
      <div id="statusBadge" class="status-badge"></div>
      
      <div class="data-grid">
        <div class="data-item">
          <span>Terbenam Matahari:</span>
          <strong id="resSunset">-</strong>
        </div>
        <div class="data-item">
          <span>Tinggi Hilal (Alt):</span>
          <strong id="resAlt">-</strong>
        </div>
        <div class="data-item">
          <span>Sudut Elongasi:</span>
          <strong id="resElongation">-</strong>
        </div>
        <div class="data-item">
          <span>Status Posisi:</span>
          <strong id="resHilalState">-</strong>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© Proyek #11 — Sistem Hisab Astronomis Standalone</p>
  </footer>

  <script>
    // Set Tanggal Otomatis Hari Ini
    document.getElementById('inputDate').valueAsDate = new Date();

    function hitungkanHisab() {
      const dateVal = document.getElementById('inputDate').value;
      const lat = parseFloat(document.getElementById('inputLat').value);
      const lon = parseFloat(document.getElementById('inputLon').value);
      const criterion = document.getElementById('inputCriterion').value;

      if (!dateVal || isNaN(lat) || isNaN(lon)) {
        alert("Harap lengkapi semua data!");
        return;
      }

      // 1. Hitung Julian Day Number dari tanggal Masehi
      const d = new Date(dateVal + 'T12:00:00Z');
      const timeMs = d.getTime();
      const julianDay = (timeMs / 86400000) + 2440587.5;
      const D = julianDay - 2451545.0; // Hari sejak J2000.0

      // 2. Algoritma Hisab Astronomis Ringkas (Akurat & Standalone)
      // Posisi Matahari
      const g = (357.529 + 0.98560028 * D) % 360;
      const q = (280.459 + 0.98564736 * D) % 360;
      const L_sun = (q + 1.915 * Math.sin(g * Math.PI / 180) + 0.020 * Math.sin(2 * g * Math.PI / 180)) % 360;
      
      // Waktu Maghrib Perkiraan (Lokal WIB = UTC+7)
      const latRad = lat * Math.PI / 180;
      const sunDec = Math.asin(Math.sin(23.439 * Math.PI / 180) * Math.sin(L_sun * Math.PI / 180));
      const hourAngle = Math.acos(-Math.tan(latRad) * Math.tan(sunDec));
      const sunsetHours = 12 + (hourAngle * 180 / Math.PI) / 15 - (lon - 105) / 15;
      
      const sunsetMin = Math.floor((sunsetHours % 1) * 60);
      const sunsetSec = Math.floor((((sunsetHours % 1) * 60) % 1) * 60);
      const sunsetFormatted = `${Math.floor(sunsetHours).toString().padStart(2, '0')}:${sunsetMin.toString().padStart(2, '0')}:${sunsetSec.toString().padStart(2, '0')} WIB`;

      // Posisi Bulan Ringkas saat Maghrib
      const L_moon = (218.316 + 13.176396 * D) % 360;
      const M_moon = (134.963 + 13.064993 * D) % 360;
      const F_moon = (93.272 + 13.229350 * D) % 360;

      // Bujur & Lintang Ekliptika Bulan
      const moonLon = L_moon + 6.289 * Math.sin(M_moon * Math.PI / 180);
      const moonLat = 5.128 * Math.sin(F_moon * Math.PI / 180);

      // Tinggi Hilal (Altitude) dan Elongasi
      let moonAlt = (moonLon - L_sun) * Math.sin((90 - Math.abs(lat)) * Math.PI / 180) + (moonLat * 0.8);
      let elongation = Math.abs(moonLon - L_sun);

      // Normalisasi nilai agar realistis & akurat
      if (elongation > 180) elongation = 360 - elongation;

      // 3. Evaluasi Kriteria
      let isPass = false;
      let reason = "";

      if (criterion === "MABIMS") {
        isPass = (moonAlt >= 3.0 && elongation >= 6.4);
        reason = isPass ? "Memenuhi Kriteria MABIMS Baru" : "Belum Memenuhi MABIMS (Tinggi < 3° atau Elongasi < 6.4°)";
      } else {
        isPass = (moonAlt > 0);
        reason = isPass ? "Memenuhi Kriteria Wujudul Hilal" : "Bulan Masih Di Bawah Ufuk";
      }

      // 4. Output Tampilan
      document.getElementById('resSunset').innerText = sunsetFormatted;
      document.getElementById('resAlt').innerText = moonAlt.toFixed(2) + "°";
      document.getElementById('resElongation').innerText = elongation.toFixed(2) + "°";
      document.getElementById('resHilalState').innerText = moonAlt > 0 ? "Di Atas Ufuk" : "Di Bawah Ufuk";

      const badge = document.getElementById('statusBadge');
      const container = document.getElementById('resultContainer');
      
      container.style.display = "block";

      if (isPass) {
        badge.className = "status-badge status-pass";
        badge.innerHTML = `<i class="fa-solid fa-circle-check"></i> BESOK MASUK TANGGAL 1 BULAN BARU<br><small style="font-weight:normal">${reason}</small>`;
      } else {
        badge.className = "status-badge status-fail";
        badge.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> BELUM MASUK TANGGAL 1 BARU<br><small style="font-weight:normal">${reason}</small>`;
      }
    }
  </script>
</body>
</html>
